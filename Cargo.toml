[workspace]
resolver = "3"
members = ["crates/xara-phy", "crates/xara-arq", "crates/xara-host", "crates/xara-ui", "crates/xara", "crates/xara-testkit", "crates/xara-ffi"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/x0rro/xara"

[workspace.dependencies]
xara-phy = { path = "crates/xara-phy" }
xara-arq = { path = "crates/xara-arq" }
xara-host = { path = "crates/xara-host" }
xara-ui = { path = "crates/xara-ui" }
xara-testkit = { path = "crates/xara-testkit" }
num-complex = "0.4"
rustfft = "6.4"
miniz_oxide = "0.8"
libc = "0.2"
alsa-sys = "0.3.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Registry"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_Security"] }

[profile.test]
opt-level = 2
