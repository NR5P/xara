[package]
name = "xara-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "C and JNI interfaces for embedding the xara modem in an app (iOS links it statically, Android loads it as a shared library)."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
xara = { path = "../xara", default-features = false }
xara-host.workspace = true
