[package]
name = "xara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "A VARA-compatible HF/FM modem for Linux and macOS with PipeWire/PulseAudio, ALSA or CoreAudio I/O and a passive monitor."

[dependencies]
xara-phy.workspace = true
xara-arq.workspace = true
xara-host.workspace = true
xara-ui.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = { workspace = true, optional = true }

[dev-dependencies]
xara-testkit.workspace = true

[features]
default = ["pulse", "alsa", "registered"]
pulse = []
alsa = ["dep:alsa-sys"]
# Registered VARA speeds, built in as in the apps; on only with --registered, for a user with a VARA licence.
registered = []
fixed-turbo = ["xara-phy/fixed-turbo"]
float-turbo = ["xara-phy/float-turbo"]
